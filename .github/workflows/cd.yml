name: AuraBook CD (Publish & Deploy)

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: "Môi trường triển khai"
        required: true
        default: "production"
        type: choice
        options:
          - "production"
          - "staging"

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================
  # 1. BUILD & PUBLISH DOCKER IMAGES (GHCR)
  # ============================================================
  publish-images:
    name: Build & Push Images to GitHub Packages (GHCR)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Owner for Docker Tagging
        id: repo_owner
        run: echo "OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # Backend Image
      - name: Extract Docker metadata for Backend
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/aurabook-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend Image
      - name: Extract Docker metadata for Frontend
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/aurabook-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SALEOR_API_URL=http://localhost:8000/graphql/
            NEXT_PUBLIC_STOREFRONT_URL=http://localhost:3000
            NEXT_PUBLIC_DEFAULT_CHANNEL=channel-vnd
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # 2. DEPLOYMENT TRIGGER & SUMMARY
  # ============================================================
  deploy:
    name: Deploy to Server
    needs: publish-images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Deployment Summary & Status Notification
        run: |
          echo "### 🚀 AuraBook Deployment Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref:** \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Image:** \`ghcr.io/${{ github.repository_owner }}/aurabook-backend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Image:** \`ghcr.io/${{ github.repository_owner }}/aurabook-frontend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Docker images đã được xây dựng và đẩy thành công lên GitHub Container Registry." >> $GITHUB_STEP_SUMMARY
