server {
    listen 80;
    server_name localhost aurabook.vn www.aurabook.vn;

    # Saleor Storefront (Next.js)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Saleor GraphQL API
    location /graphql/ {
        proxy_pass http://backend:8000/graphql/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # AuraBook Custom REST APIs (DRM, AI, Audio)
    location /aurabook/ {
        proxy_pass http://backend:8000/aurabook/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE streaming support (RAG responses)
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Saleor Dashboard (Admin)
    location /dashboard/ {
        proxy_pass http://dashboard:80/dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static & Media files
    location /static/ {
        proxy_pass http://backend:8000/static/;
    }

    location /media/ {
        proxy_pass http://backend:8000/media/;
        # Cache media files
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
