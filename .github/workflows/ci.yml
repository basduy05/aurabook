name: AuraBook CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 1. FRONTEND: LINT, TYPECHECK, UNIT TESTS, NEXT.JS BUILD
  # ============================================================
  frontend-ci:
    name: Frontend — Typecheck, Test & Build (Next.js 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate GraphQL types & schema bindings
        run: pnpm run generate:all

      - name: TypeScript Typecheck
        run: pnpm run typecheck

      - name: Run Vitest Unit Tests (720+ tests)
        run: pnpm run test:run

      - name: Next.js Production Build Verification
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_STOREFRONT_URL: http://localhost:3000
          NEXT_PUBLIC_SALEOR_API_URL: http://localhost:8000/graphql/
          NEXT_PUBLIC_DEFAULT_CHANNEL: channel-vnd
          NEXT_PUBLIC_DEFAULT_LOCALE: vi
          NEXT_PUBLIC_ALLOW_DUMMY_PAYMENT: "true"

  # ============================================================
  # 2. BACKEND: LINT, DJANGO CHECK, MIGRATIONS (Python 3.12)
  # ============================================================
  backend-ci:
    name: Backend — Django, Celery & Custom Apps (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aurabook_user
          POSTGRES_PASSWORD: aurabook_secure_password
          POSTGRES_DB: aurabook_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv (Fast Python Package Manager)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies via uv
        run: uv sync --frozen

      - name: Lint Aurabook Custom Apps (DRM, Reading Progress, AI)
        run: uv run ruff check --select E,F,W aurabook_apps

      - name: Django System & Configuration Check
        run: uv run python manage.py check
        env:
          SECRET_KEY: django-insecure-aurabook-ci-testing-key-32-chars
          DATABASE_URL: postgresql://aurabook_user:aurabook_secure_password@localhost:5432/aurabook_db
          CELERY_BROKER_URL: redis://localhost:6379/0
          CACHE_URL: redis://localhost:6379/1
          DEBUG: "True"

      - name: Check for uncreated Django migrations
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          SECRET_KEY: django-insecure-aurabook-ci-testing-key-32-chars
          DATABASE_URL: postgresql://aurabook_user:aurabook_secure_password@localhost:5432/aurabook_db
          CELERY_BROKER_URL: redis://localhost:6379/0
          CACHE_URL: redis://localhost:6379/1

  # ============================================================
  # 3. DOCKER & INFRASTRUCTURE VALIDATION
  # ============================================================
  docker-infra-ci:
    name: Infrastructure & Docker Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose -f infra/docker-compose.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image (Cache check)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: aurabook-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image (Cache check)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: aurabook-frontend:test
          build-args: |
            NEXT_PUBLIC_SALEOR_API_URL=http://localhost:8000/graphql/
            NEXT_PUBLIC_STOREFRONT_URL=http://localhost:3000
            NEXT_PUBLIC_DEFAULT_CHANNEL=channel-vnd
          cache-from: type=gha
          cache-to: type=gha,mode=max
