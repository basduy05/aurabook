services:
  postgres:
    image: postgres:16-alpine
    container_name: aurabook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aurabook_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurabook_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-aurabook_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aurabook_user} -d ${POSTGRES_DB:-aurabook_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aurabook-network

  redis:
    image: redis:7-alpine
    container_name: aurabook-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aurabook-network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: aurabook-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-True}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-aurabook_user}:${POSTGRES_PASSWORD:-aurabook_secure_password}@postgres:5432/${POSTGRES_DB:-aurabook_db}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-aurabook_super_secret_jwt_key_change_in_production_32chars!}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    volumes:
      - ./apps/api/app:/app/app
      - ./apps/api/tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aurabook-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: aurabook-web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_APP_NAME=AuraBook
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    networks:
      - aurabook-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  aurabook-network:
    driver: bridge
